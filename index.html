<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thi trực tuyến</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f9fa;--c:#fff;--t:#0c2d48;--m:#5b7185;--p:#00818a;--ac:#1fb2b2;--mint:#e3f6f5;--ok:#15803d;--no:#c62828;--wa:#c2670a;--bd:#dbe6ea;--sh:0 2px 14px rgba(12,45,72,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1a26;--c:#10283a;--t:#e8f2f5;--m:#94aebb;--p:#0f9aa3;--mint:#14384a;--bd:#1f3c50;--sh:0 2px 14px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;background:var(--c);border-bottom:1px solid var(--bd)}
.sp{flex:1}
.pill{font-size:12px;padding:2px 9px;border-radius:99px;background:#fef3c7;color:#92400e}.pill.on{background:#dcfce7;color:#166534}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
h2,h3{margin:0 0 10px}.mu{color:var(--m);font-size:13px}
label{display:block;font-weight:600;font-size:14px}
input,select,textarea{width:100%;padding:10px 12px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
textarea{min-height:80px;resize:vertical}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--p);color:#fff}
button.b2{background:transparent;color:var(--t);border:1px solid var(--bd)}button.bd{background:var(--no)}button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}.tabs button{background:var(--c);color:var(--t);border:1px solid var(--bd)}.tabs button.on{background:var(--p);color:#fff}
.sticky{position:sticky;top:56px;z-index:4}
.exam{display:grid;grid-template-columns:1fr 230px;gap:14px;align-items:start}.exam aside{position:sticky;top:130px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;margin:8px 0;border:1px solid var(--bd);border-radius:8px;cursor:pointer;font-weight:400}
.opt input{width:auto;margin:4px 0}.opt.on{border-color:var(--p);background:#0b6e8a1c}.opt.ok{border-color:var(--ok);background:#15803d22}.opt.no{border-color:var(--no);background:#c6282822}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}.nav button{padding:8px 0;background:var(--bg);color:var(--t);border:1px solid var(--bd)}
.nav .done{background:#15803d44}.nav .fl{outline:2px solid var(--wa)}.nav .cur{background:var(--p);color:#fff}
#tm{font:700 22px ui-monospace,Consolas,monospace}#tm.low{color:var(--no)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.st{padding:10px 14px;border-radius:8px;margin:12px 0}.st.ok{background:#15803d22}.st.no{background:#c6282822}.st.w{background:#c2670a22}
.big{font-size:48px;font-weight:800;color:var(--p)}.ex{margin-top:6px;padding:8px 12px;border-radius:8px;background:#0b6e8a14;font-size:14px}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--no)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:90%;padding:10px 16px;border-radius:8px;background:#111827;color:#fff;opacity:0;pointer-events:none;transition:.2s;z-index:20}#toast.show{opacity:1}#toast.bad{background:var(--no)}
#md{display:none;position:fixed;inset:0;z-index:15;overflow:auto;padding:16px;background:#0009}#md>div{max-width:760px;margin:0 auto}
.w{background:var(--bg);color:var(--t);border:1px solid var(--bd);padding:8px 12px;margin:3px}.w.on{background:var(--p);color:#fff;border-color:var(--p)}
.ln{min-height:54px;padding:8px;margin:8px 0;border:2px dashed var(--bd);border-radius:8px;display:flex;flex-wrap:wrap;align-items:center}
@media(max-width:760px){.exam{grid-template-columns:1fr}.exam aside{position:static}.big{font-size:38px}}
/* ===== Giao diện giáo dục hiện đại: teal + navy ===== */
body{font:16px/1.6 Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.top{padding:12px 24px;box-shadow:var(--sh)}.top>b{font-size:18px;font-weight:800}
.wrap{padding:24px 20px}
.card{border-radius:16px;padding:24px;margin-bottom:18px;box-shadow:var(--sh)}
h2,h3{color:var(--t);font-weight:700}
input,select,textarea{border-radius:12px;padding:12px 14px;background:var(--c)}
input:focus,select:focus,textarea:focus{border-color:var(--ac);outline:3px solid #1fb2b240}
button{min-height:44px;padding:11px 22px;border-radius:12px;font-weight:600;transition:filter .2s,box-shadow .2s,transform .1s}
button:hover:not(:disabled){filter:brightness(.92);box-shadow:0 4px 12px rgba(12,45,72,.16)}button:active:not(:disabled){transform:translateY(1px)}
button.b2{background:var(--c);color:var(--p);border:1.5px solid var(--ac)}
.tabs button{border-radius:99px}
.sticky{top:70px}.exam aside{top:150px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opts .opt{margin:0}
.opt{border:1.5px solid var(--bd);border-radius:12px;padding:14px 16px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--ac)}.opt input{accent-color:var(--p);width:18px;height:18px}.opt.on{border-color:var(--ac);background:var(--mint)}
.nav .done{background:var(--mint);border-color:var(--ac)}
th{background:var(--mint);color:var(--t)}.ex{background:var(--mint)}.pill.on{background:var(--mint);color:var(--p)}
.qh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.tag{padding:2px 12px;border-radius:99px;background:var(--mint);color:var(--p);border:1px solid var(--ac);font-size:12px;font-weight:700}
.g2c{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.pick{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--bd);border-radius:14px;cursor:pointer;transition:border-color .15s,background .15s}
.pick:hover{border-color:var(--ac)}.pick.on{border-color:var(--ac);background:var(--mint)}
.ck{flex:none;display:grid;place-items:center;width:22px;height:22px;margin-top:2px;border:2px solid var(--bd);border-radius:7px;color:#fff;font-size:14px}
.pick.on .ck{background:var(--p);border-color:var(--p)}.pick.on .ck::after{content:"✓"}
.stp{display:flex;max-width:640px;margin:0 auto 22px}
.stp .s{flex:1;position:relative;text-align:center;color:var(--m)}
.stp .s::before{content:"";position:absolute;top:19px;left:-50%;width:100%;height:3px;background:var(--bd)}.stp .s:first-child::before{display:none}
.stp .s span{position:relative;z-index:1;display:grid;place-items:center;width:38px;height:38px;margin:0 auto 4px;border-radius:50%;background:var(--c);border:2px solid var(--bd);font-weight:700}
.stp .s small{display:block;font-size:12px}
.stp .s.dn span{background:var(--p);border-color:var(--p);color:#fff}.stp .s.dn::before,.stp .s.cu::before{background:var(--ac)}
.stp .s.cu span{border-color:var(--ac);color:var(--p);box-shadow:0 0 0 4px #1fb2b233}.stp .s.cu small,.stp .s.dn small{color:var(--t);font-weight:600}
@media(max-width:760px){.opts,.g2c{grid-template-columns:1fr}.stp .s small{font-size:10px}.card{padding:18px}}
</style>
</head>
<body>
<header class="top"><b>Thi trực tuyến</b><span id="mode" class="pill"></span><span class="sp"></span><button class="b2" onclick="view('home')">Học viên</button><button class="b2" onclick="view('teacher')">Giáo viên</button></header>
<main id="app" class="wrap"></main>
<div id="toast"></div><div id="md" onclick="if(event.target===this)this.style.display='none'"></div>
<script>
/* ===== CẤU HÌNH =====
   WEB_APP_URL: dán URL Web App (Apps Script, đuôi /exec) để MỌI học viên kết nối Google Sheets.
   (Ô nhập ở Giáo viên ▸ Cài đặt chỉ lưu trên trình duyệt của giáo viên.)
   Để trống = chế độ Demo/Offline: dữ liệu lưu ngay trên trình duyệt, có sẵn đề mẫu. */
const WEB_APP_URL='';
const OFFLINE_PASS='1234'; // mật khẩu giáo viên ở chế độ Demo/Offline (khi online dùng PASS trong Code.gs)

const $=s=>document.querySelector(s),L='ABCD';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS=(k,v)=>v===undefined?JSON.parse(localStorage.getItem(k)||'null'):localStorage.setItem(k,JSON.stringify(v));
const url=()=>(LS('cfg')||{}).url??WEB_APP_URL;
const fmt=t=>/T.*Z$/.test(t)?new Date(t).toLocaleString('vi-VN'):t;
const newD=()=>({id:'',name:'',cls:'',min:30,qs:[]});
let PW='',ADMIN=false,EX=[],RS=[],FR=[],A=null,T=0,LAST=null,TAB='build',D=newD(),EI=-1,V='home';

const DEMO={id:'DEMO',name:'Đề mẫu – Kiến thức chung',cls:'Mẫu',min:5,qs:[
{q:'Thủ đô của Việt Nam là thành phố nào?',o:['Huế','Hà Nội','Đà Nẵng','Cần Thơ'],a:1,e:'Hà Nội là thủ đô của nước Cộng hòa Xã hội Chủ nghĩa Việt Nam.',p:2},
{q:'7 × 8 = ?',o:['56','54','64','58'],a:0,e:'7 × 8 = 56.',p:2},
{q:'Hành tinh nào gần Mặt Trời nhất?',o:['Sao Hỏa','Sao Kim','Sao Thủy','Trái Đất'],a:2,e:'Sao Thủy là hành tinh gần Mặt Trời nhất.',p:2},
{q:'Đại dương lớn nhất thế giới là?',o:['Đại Tây Dương','Ấn Độ Dương','Bắc Băng Dương','Thái Bình Dương'],a:3,e:'Thái Bình Dương chiếm khoảng một phần ba diện tích Trái Đất.',p:2},
{q:'H₂O là công thức hóa học của chất nào?',o:['Muối ăn','Khí oxi','Nước','Cồn'],a:2,e:'H₂O gồm 2 nguyên tử hiđro và 1 nguyên tử oxi: đó là nước.',p:2}]};

function say(m,bad){const t=$('#toast');t.textContent=m;t.className='show'+(bad?' bad':'');clearTimeout(say.h);say.h=setTimeout(()=>t.className='',3000)}

/* ===== DỮ LIỆU: Google Sheets (online) hoặc localStorage (Demo/Offline) ===== */
async function api(a,d={}){
 const u=url();
 if(!u){
  if(a==='media')return{ok:true,id:'offline'};
  if(a==='lib')return{ok:true,data:LS('lib')||[]};
  if(a==='libUpload'){const l=LS('lib')||[];l.push({...d.meta,id:'L'+Date.now().toString(36),at:new Date().toLocaleString('vi-VN')});LS('lib',l);return{ok:true}}
  if(a==='libDelete'){LS('lib',(LS('lib')||[]).filter(x=>x.id!==d.id));return{ok:true}}
  if(a==='libFile')throw new Error('Chế độ Demo/Offline không lưu tệp gốc (chỉ lưu bản phân tích)');
  let ex=LS('exams');if(!ex){ex=[DEMO];LS('exams',ex)}
  const rs=LS('results')||[];
  if(a==='saveExam'){ex=ex.filter(e=>e.id!==d.exam.id).concat(d.exam);LS('exams',ex)}
  if(a==='deleteExam'){ex=ex.filter(e=>e.id!==d.id);LS('exams',ex)}
  if(a==='submit'&&!rs.some(r=>r.sid===d.result.sid)){rs.push(d.result);LS('results',rs)}
  return{ok:true,data:a==='exams'?ex:rs}
 }
 const r=await(/^(exams|results|lib|libFile|mediaFile)$/.test(a)?fetch(u+'?action='+a+'&pw='+encodeURIComponent(PW)+'&id='+encodeURIComponent(d.id||'')):fetch(u,{method:'POST',body:JSON.stringify({...d,action:a,pw:PW})}));
 const j=await r.json();if(!j.ok)throw new Error(j.error||'Lỗi máy chủ');return j
}
async function loadExams(){EX=(await api('exams')).data.map(e=>({...e,id:String(e.id),name:String(e.name),cls:String(e.cls??''),min:+e.min||30}))}

/* ===== ĐIỀU HƯỚNG ===== */
const VS={home:vHome,exam:vExam,result:vResult,teacher:vTeacher};
function view(v){
 if(V==='exam'&&v!=='exam')clearInterval(T);
 V=v;scrollTo(0,0);VS[v]();
 const o=!!url();$('#mode').textContent=o?'Online · Google Sheets':'Demo/Offline';$('#mode').className='pill'+(o?' on':'')
}

/* ===== HỌC VIÊN ===== */
function vHome(){
 const d=LS('draft');
 $('#app').innerHTML=`${steps(0)}${d?`<div class="card st w"><b>Bạn có bài đang làm dở:</b> ${esc(d.name)} · ${esc(d.exam.name)}<div class="row" style="margin-top:8px"><button onclick="A=LS('draft');view('exam')">Tiếp tục làm bài</button></div></div>`:''}
 <div class="card" style="max-width:760px;margin:auto"><h2>Vào thi</h2>
 <label>Họ và tên<input id="hn" autocomplete="name" placeholder="Nguyễn Văn A"></label>
 <label>Lớp<input id="hl" placeholder="Ví dụ: 7A"></label>
 <b style="font-size:14px">Chọn bài kiểm tra</b><div class="g2c" style="margin-top:8px">${EX.map((e,i)=>`<div class="pick${i?'':' on'}" data-id="${esc(e.id)}" onclick="selEx(this)"><span class="ck"></span><div><b>${esc(e.name)}</b><div class="mu">${esc(e.cls)} · ${e.min} phút${e.std?' · '+esc(e.std):''}</div></div></div>`).join('')||'<span class="mu">(Chưa có đề thi)</span>'}</div><input type="hidden" id="hs" value="${esc(EX[0]?EX[0].id:'')}">
 <label>Hoặc nhập mã đề<input id="hc" placeholder="Mã đề (nếu giáo viên đã cung cấp)"></label>
 <button style="width:100%" onclick="begin()">Bắt đầu làm bài</button></div>`
}
function begin(){
 const n=$('#hn').value.trim(),c=$('#hl').value.trim(),id=($('#hc').value.trim()||$('#hs').value).toUpperCase();
 const e=EX.find(x=>x.id.toUpperCase()===id);
 if(!n||!c)return say('Vui lòng nhập họ tên và lớp',1);
 if(!e)return say('Không tìm thấy bài kiểm tra hoặc mã đề',1);
 if(!confirm(`Bắt đầu "${e.name}" — ${e.qs.length} câu, ${e.min} phút?\nĐồng hồ sẽ chạy ngay.`))return;
 A={sid:'S'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),exam:e,name:n,cls:c,ans:e.qs.map(()=>-1),sh:e.qs.map(q=>q.t==='order'?shuf(q.k.trim().split(/\s+/)):null),flag:e.qs.map(()=>0),cur:0,end:Date.now()+e.min*60000};
 save();view('exam')
}
const save=()=>LS('draft',A);
function vExam(){
 $('#app').innerHTML=`${steps(1)}<div class="card sticky row"><b>${esc(A.exam.name)}</b>${A.exam.std?`<span class="pill on">${esc(A.exam.std)}</span>`:''}<span class="sp"></span><span class="mu" id="pg"></span><span id="tm">--:--</span><button class="bd" onclick="finish()">Nộp bài</button></div>
 <div class="exam"><div id="qa"></div><aside class="card"><b>Danh sách câu hỏi</b><div class="nav" id="nav" style="margin:10px 0"></div><div class="mu">Xanh: đã làm · Viền cam: xem lại · Trắng: chưa làm</div></aside></div>`;
 renderQ();clearInterval(T);T=setInterval(tick,1000);tick()
}
function renderQ(){
 const e=A.exam,i=A.cur,q=e.qs[i];
 $('#qa').innerHTML=`<div class="card"><div class="qh"><span class="mu">Câu ${i+1}/${e.qs.length} · ${q.p} điểm</span>${lvTag(q)}</div><h3 style="white-space:pre-wrap">${esc(q.q)}</h3>${body(q,i)}<div class="row" style="margin-top:12px"><button class="b2" onclick="go(${i-1})" ${i?'':'disabled'}>← Trước</button><button class="b2" onclick="flag()">${A.flag[i]?'★ Bỏ đánh dấu':'☆ Đánh dấu xem lại'}</button><span class="sp"></span><button onclick="go(${i+1})" ${i<e.qs.length-1?'':'disabled'}>Sau →</button></div></div>`;
 navUp();
 
}
const go=i=>{A.cur=i;save();renderQ()};
const pick=k=>{A.ans[A.cur]=k;save();renderQ()};
const flag=()=>{A.flag[A.cur]^=1;save();renderQ()};
function tick(){
 const el=$('#tm');if(!el||!A)return;
 const s=Math.max(0,Math.round((A.end-Date.now())/1000));
 el.textContent=`${String(s/60|0).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;el.classList.toggle('low',s<60);
 if(!s){clearInterval(T);say('Hết giờ — hệ thống tự động nộp bài');finish(true)}
}
function finish(auto){
 if(!A)return;
 if(!auto){const n=A.exam.qs.filter((q,j)=>!did(q,A.ans[j])).length;if(!confirm(n?`Bạn còn ${n} câu chưa làm. Vẫn nộp bài?`:'Xác nhận nộp bài?'))return}
 clearInterval(T);
 const e=A.exam,wrong=[];let got=0,tot=0,right=0;
 const fin=e.qs.map((q,i)=>{const t=q.t||'mc',a=A.ans[i];return t==='order'?(Array.isArray(a)?a.map(j=>A.sh[i][j]).join(' '):''):t==='fill'?(typeof a==='string'?a.trim():''):isMan(q)?(a==='rec'?'rec':''):a}),nAuto=e.qs.filter(q=>!isMan(q)).length;
 e.qs.forEach((q,i)=>{if(isMan(q))return;tot+=q.p;if(isOk(q,fin[i])){got+=q.p;right++}else wrong.push(i+1)});
 const r={sid:A.sid,time:new Date().toISOString(),name:A.name,cls:A.cls,id:e.id,exam:e.name,score:Math.round(got/(tot||1)*1000)/100,right,total:nAuto,wrong,ans:fin};
 LAST={r,exam:e,sent:false,media:{...MED}};Object.keys(MED).forEach(k=>delete MED[k]);LS('last',LAST);localStorage.removeItem('draft');A=null;
 view('result');send()
}
const setSt=(m,c)=>{const s=$('#sv');if(s){s.className='st '+c;s.innerHTML=m}};
async function send(){
 setSt('Đang lưu điểm lên Google Sheets...','w');
 try{for(const[i,b]of Object.entries(LAST.media||{})){if(b instanceof Blob){setSt(`Đang tải bản ghi câu ${+i+1} lên...`,'w');LAST.r.ans[i]='M:'+(await api('media',{mime:b.type,data:await b64(b)})).id;delete LAST.media[i]}}await api('submit',{result:LAST.r});LAST.sent=true;LS('last',LAST);setSt('✔ Đã lưu điểm thành công','ok');stepAt(4)}
 catch(e){setSt('✖ Chưa lưu được điểm (mạng chập chờn). <button onclick="send()">Gửi lại</button>','no')}
}
const review=(q,i,a)=>{
 if((q.t||'mc')!=='mc')return reviewX(q,i,a);
 const s=a===undefined?'':a===q.a?' · <b style="color:var(--ok)">Đúng</b>':a<0?' · <b style="color:var(--wa)">Chưa làm</b>':' · <b style="color:var(--no)">Sai</b>';
 return`<div class="card"><div class="qh"><span class="mu">Câu ${i+1}${s}</span>${lvTag(q)}</div><h3 style="white-space:pre-wrap">${esc(q.q)}</h3>${q.o.map((o,k)=>`<div class="opt ${k===q.a?'ok':k===a?'no':''}"><span><b>${L[k]}.</b> ${esc(o)} ${k===q.a?'✔':k===a?'✖ (đã chọn)':''}</span></div>`).join('')}${q.e?`<div class="ex">Giải thích: ${esc(q.e)}</div>`:''}</div>`
};
function vResult(){
 const{r,exam:e}=LAST;

function addQ(){

 if(t==='mc'){q.o=[0,1,2,3].map(k=>$('#o'+k).value.trim());q.a=+document.querySelector('input[name=ca]:checked').value}

function editQ(i){
 sync();EI=i;tBuild();const q=D.qs[i];
 const t=q.t||'mc';$('#qt').value=t;qtype();$('#qi').value=q.ins||'';$('#qv').value=q.lv||'';$('#qm').value=q.img||'';$('#qq').value=q.q;$('#qk').value=q.k||'';$('#qs').value=q.sec||30;if(t==='mc')q.o.forEach((o,k)=>$('#o'+k).value=o);

}
function bulk(){
 sync();let n=0,bad=0;
 $('#bk').value.replace(/\r/g,'').split(/\n\s*\n/).forEach(b=>{
  if(!b.trim())return;
  const q=[],o=[],r={e:'',p:1};let a=-1,m;
  b.split('\n').forEach(l=>{
   l=l.trim();if(!l)return;
   if(m=l.match(/^(\*)?\s*([A-Da-d])[.)]\s*(.+)$/)){if(m[1])a=o.length;o.push(m[3])}
   else if(m=l.match(/^(?:giải thích|gt)\s*:\s*(.*)$/i))r.e=m[1];
   else if(m=l.match(/^(?:điểm|diem)\s*:\s*([\d.]+)/i))r.p=+m[1]||1;
   else if(!o.length)q.push(l)
  });
  const t=q.join('\n').replace(/^(?:câu|cau|question)?\s*\d+\s*[:.)\-]\s*/i,'');
  if(t&&o.length===4&&a>=0){D.qs.push({q:t,o,a,e:r.e,p:r.p});n++}else bad++
 });
 tBuild();say(`Đã nhập ${n} câu${bad?`, bỏ qua ${bad} đoạn lỗi (cần đủ 4 đáp án và 1 dấu *)`:''}`,!n)
}

function filt(){
 const q=$('#fq').value.toLowerCase(),c=$('#fc').value,x=$('#fx').value;
 FR=RS.filter(r=>(!q||r.name.toLowerCase().includes(q))&&(!c||r.cls===c)&&(!x||r.id===x)).reverse();
 const s=FR.map(r=>r.score),n=s.length,f=v=>n?v.toFixed(2):'–';
 let h=`<div class="g2" style="margin-bottom:14px">${[['Số bài làm',n],['Điểm trung bình',f(s.reduce((a,b)=>a+b,0)/n)],['Điểm cao nhất',f(Math.max(...s))],['Điểm thấp nhất',f(Math.min(...s))]].map(([k,v])=>`<div class="card" style="margin:0"><div class="mu">${k}</div><div style="font-size:26px;font-weight:700">${v}</div></div>`).join('')}</div>`;
 const ex=EX.find(e=>e.id===x);
 if(ex&&n){
  const cnt=ex.qs.map((_,i)=>FR.filter(r=>r.wrong.includes(i+1)).length);
  h+=`<div class="card"><h3>Tỷ lệ làm sai từng câu (câu sai nhiều nhất ở trên)</h3>${ex.qs.map((q,i)=>[i,cnt[i]]).sort((a,b)=>b[1]-a[1]).map(([i,k])=>`<div style="margin:10px 0"><div class="row"><span style="flex:1">Câu ${i+1}: ${esc(ex.qs[i].q.slice(0,70))}</span><b>${Math.round(k/n*100)}%</b><span class="mu">(${k}/${n})</span></div><div class="bar"><i style="width:${k/n*100}%"></i></div></div>`).join('')}</div>`
 }else h+='<p class="mu">Chọn một bài kiểm tra ở bộ lọc để xem tỷ lệ làm sai từng câu.</p>';
 h+=`<div class="card tw"><table><tr><th>Họ tên</th><th>Lớp</th><th>Mã đề</th><th>Điểm</th><th>Đúng/Tổng</th><th>Nộp lúc</th><th>Câu sai (bấm để xem chi tiết)</th></tr>${FR.map((r,i)=>`<tr><td>${esc(r.name)}</td><td>${esc(r.cls)}</td><td>${esc(r.id)}</td><td><b>${r.score}</b></td><td>${r.right}/${r.total}</td><td>${esc(fmt(r.time))}</td><td><a href="#" onclick="detail(${i});return false">${r.wrong.join(', ')||'Xem'}</a></td></tr>`).join('')}</table></div>`;
 $('#st').innerHTML=h
}
function detail(i){
 const r=FR[i],e=EX.find(x=>x.id===r.id);

const LV={Kid:['1','2','3','4'],Junior:['1','2','3','4','5','6','7','8+'],Teen:['1','2','3','4'],IELTS:['1','2','3','4','5']};
let LIB=[],LP='Kid',LL='1';const JS={};
const STOP=new Set('the and for are was were but not you your with that this from have has had they them their there here what which when where who how why all any can could will would should may might must just also into out about than then too very its our his her him she nor yet one two did does done been being get got let say said use used like more most some such only own same other these those because while after before over under again each both few many much'.split(' '));
const rd=f=>f>=80?'Dễ':f>=60?'Vừa':f>=30?'Khó':'Rất khó';
const need=(k,src)=>JS[k]||(JS[k]=new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>{delete JS[k];no(new Error('Không tải được thư viện đọc tệp (cần internet)'))};document.head.appendChild(s)}));
const b64=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});
async function extract(f,st){
 const ext=f.name.split('.').pop().toLowerCase();
 if(ext==='docx'){await need('m','https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js');return(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}
 if(ext==='pdf'){
  await need('p','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';
  for(let i=1;i<=d.numPages;i++){st(`Đọc PDF: trang ${i}/${d.numPages}`);t+=(await(await d.getPage(i)).getTextContent()).items.map(x=>x.str).join(' ')+'\n'}
  return t
 }
 await need('t','https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js');
 st('Nhận dạng chữ trong ảnh (OCR), có thể mất vài chục giây...');
 return(await Tesseract.recognize(f,'eng')).data.text
}
function analyze(t){
 const w=t.toLowerCase().match(/[a-z]+(?:'[a-z]+)?/g)||[],s=(t.match(/[.!?]+(\s|$)/g)||[]).length||1,f={};
 w.forEach(x=>{if(x.length>2&&!STOP.has(x))f[x]=(f[x]||0)+1});
 const syl=w.reduce((n,x)=>n+Math.max(1,(x.replace(/e$/,'').match(/[aeiouy]+/g)||[]).length),0);
 return{words:w.length,uniq:new Set(w).size,sents:s,fre:w.length?Math.round(206.835-1.015*w.length/s-84.6*syl/w.length):0,top:Object.entries(f).sort((a,b)=>b[1]-a[1]).slice(0,40)}
}
async function tLib(){

 try{LIB=(await api('lib')).data.map(x=>({...x,id:String(x.id),prog:String(x.prog),lvl:String(x.lvl),size:+x.size||0,stats:x.stats||{}}))}
 catch(e){$('#tb').innerHTML=`<div class="card st no">Không tải được học liệu: ${esc(e.message)}</div>`;return}
 libView()
}
function libView(){
 const cur=LIB.filter(x=>x.prog===LP&&x.lvl===LL),g={words:0,fre:0,top:{}};
 cur.forEach(x=>{const s=x.stats;g.words+=s.words||0;g.fre+=s.fre||0;(s.top||[]).forEach(([k,v])=>g.top[k]=(g.top[k]||0)+v)});
 const top=Object.entries(g.top).sort((a,b)=>b[1]-a[1]).slice(0,30);

async function upLib(){
 const fs=[...$('#lf').files],apw=$('#la').value,st=m=>$('#ls').textContent=m;
 if(!fs.length)return say('Hãy chọn tệp cần tải lên',1);
 if(!apw)return say('Cần nhập mật khẩu quản trị',1);
 let ok=0;
 for(const f of fs){
  try{
   if(!/\.(docx|pdf|png)$/i.test(f.name))throw new Error('chỉ nhận .docx, .pdf, .png');
   if(f.size>8*1048576)throw new Error('vượt quá 8 MB');
   st(`Đang xử lý ${f.name}...`);
   const stats=analyze(await extract(f,st));
   if(!stats.words)say(f.name+': không trích được chữ (PDF scan? hãy tải lên dạng PNG để OCR)',1);
   st(`Đang tải ${f.name} lên...`);
   await api('libUpload',{apw,meta:{prog:LP,lvl:LL,name:f.name,type:f.name.split('.').pop().toLowerCase(),size:f.size,stats},data:await b64(f)});ok++
  }catch(e){say(`${f.name}: ${e.message}`,1)}
 }
 if(ok)say(`✔ Đã tải lên ${ok} tệp`);
 tLib()
}

/* --- Trợ lý AI tạo đề từ tài liệu (chỉ giáo viên) --- */
const AI=()=>({prov:'gemini',key:'',model:'',...LS('ai')});
function saveAI(){LS('ai',{prov:$('#ap').value,key:$('#ak').value.trim(),model:$('#am').value.trim()});say('Đã lưu cấu hình AI trên trình duyệt này')}
function tAI(){
 const c=AI();
 $('#tb').innerHTML=`<div class="card"><h3>Trợ lý AI: tạo đề từ tài liệu</h3><p class="mu">Câu hỏi AI soạn sẽ được đưa vào tab Tạo đề thi để bạn rà soát và sửa trước khi lưu. Học viên không nhìn thấy tính năng này.${c.prov!=='proxy'&&!c.key?' <b style="color:var(--no)">Chưa có API Key: vào Cài đặt để nhập.</b>':''}</p>
 <label>1. Dán nội dung tài liệu (bài đọc, từ vựng, tóm tắt ngữ pháp...)<textarea id="at" style="min-height:200px" placeholder="Dán văn bản vào đây, hoặc chọn tệp bên dưới"></textarea></label>
 <label>Hoặc chọn tệp (.txt, .md, .pdf, .docx)<input id="af" type="file" accept=".txt,.md,.pdf,.docx" onchange="readSrc()"></label><div id="as" class="mu"></div></div>
 <div class="card"><h3>2. Cấu hình đề</h3><div class="g2">
 <label>Trình độ / đối tượng<select id="al">${['Tự động bám sát độ khó của tài liệu','Starters / Movers','Flyers','Lớp 6–9','KET / PET','IELTS'].map(x=>`<option>${x}</option>`).join('')}</select></label>
 <label>Số câu hỏi<select id="an">${[5,10,15,20].map(x=>`<option ${x===10?'selected':''}>${x}</option>`).join('')}</select></label>
 <label>Trọng tâm kiểm tra<select id="ag">${['Tổng hợp','Đọc hiểu (Reading Comprehension)','Từ vựng theo ngữ cảnh (Vocabulary in Context)','Ngữ pháp (Grammar)'].map(x=>`<option>${x}</option>`).join('')}</select></label></div>
 <label>Yêu cầu bổ sung (tùy chọn)<input id="ax" placeholder="VD: Chỉ dùng từ vựng có trong đoạn văn; giải thích bằng tiếng Việt dễ hiểu"></label>
 <button id="ab" onclick="genAI()">Tạo đề ngay</button><div id="ar" class="mu" style="margin-top:8px"></div></div>`
}
async function readSrc(){
 const f=$('#af').files[0];if(!f)return;const st=m=>$('#as').textContent=m;
 try{
  if(!/\.(txt|md|pdf|docx)$/i.test(f.name))throw new Error('chỉ nhận .txt, .md, .pdf, .docx');
  st('Đang đọc tệp...');
  $('#at').value=/\.(txt|md)$/i.test(f.name)?await f.text():await extract(f,st);
  st(`✔ Đã đọc "${f.name}" (${$('#at').value.length} ký tự). Bạn có thể chỉnh sửa nội dung trước khi tạo đề.`)
 }catch(e){st('');say(`${f.name}: ${e.message}`,1)}
}
async function callAI(c,sys,usr){
 let res;
 try{
  if(c.prov==='proxy')return(await api('ai',{payload:{sys,usr}})).text;
  if(c.prov==='openai')res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+c.key},body:JSON.stringify({model:c.model||'gpt-4o-mini',temperature:.4,response_format:{type:'json_object'},messages:[{role:'system',content:sys},{role:'user',content:usr}]})});
  else res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${c.model||'gemini-2.5-flash'}:generateContent?key=${encodeURIComponent(c.key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:sys+'\n\n'+usr}]}],generationConfig:{responseMimeType:'application/json',temperature:.4}})});
 }catch(e){throw new Error(c.prov==='proxy'?e.message:'Không kết nối được tới nhà cung cấp AI. Hãy kiểm tra mạng.')}
 const j=await res.json().catch(()=>({}));
 if(!res.ok){const m=(j.error&&j.error.message)||'';
  throw new Error(res.status===401||res.status===403||/api key|api_key/i.test(m)?'API Key sai hoặc không có quyền sử dụng. Hãy kiểm tra lại trong Cài đặt.':res.status===429?'API Key đã vượt hạn mức, hãy thử lại sau ít phút.':/token|too long|length/i.test(m)?'Tài liệu quá dài so với giới hạn của mô hình, hãy cắt bớt.':`Lỗi từ AI (${res.status}): ${m.slice(0,160)}`)}
 return c.prov==='openai'?j.choices?.[0]?.message?.content||'':j.candidates?.[0]?.content?.parts?.[0]?.text||''
}
function parseQs(t){
 let j;t=String(t).replace(/^```(?:json)?|```$/gm,'').trim();
 try{j=JSON.parse(t)}catch(e){const m=t.match(/[\[{][\s\S]*[\]}]/);try{j=JSON.parse(m&&m[0])}catch(x){return[]}}
 return(Array.isArray(j)?j:(j&&j.questions)||[]).map(x=>({q:String(x.q||'').trim(),o:(x.o||[]).map(s=>String(s).replace(/^\s*[A-Da-d][.)]\s+/,'').trim()),a:Number.isInteger(+x.a)?+x.a:-1,e:String(x.e||'').trim(),p:1})).filter(x=>x.q&&x.o.length===4&&x.o.every(Boolean)&&x.a>=0&&x.a<4)
}
async function genAI(){
 const c=AI(),src=$('#at').value.trim(),n=+$('#an').value,b=$('#ab'),r=m=>$('#ar').textContent=m;
 if(src.length<200)return say('Tài liệu quá ngắn: cần ít nhất khoảng 200 ký tự để AI soạn câu hỏi',1);
 if(src.length>30000)return say('Tài liệu quá dài (tối đa 30.000 ký tự). Hãy cắt bớt hoặc chia thành nhiều lần',1);
 if(c.prov!=='proxy'&&!c.key)return say('Chưa có API Key. Vào Cài đặt ▸ Trợ lý AI để nhập',1);
 if(c.prov==='proxy'&&!url())return say('Chế độ Máy chủ cần kết nối Google Sheets (Web App URL)',1);
 const sys='Bạn là giáo viên tiếng Anh giàu kinh nghiệm, chuyên soạn đề trắc nghiệm. CHỈ trả về một đối tượng JSON hợp lệ có dạng {"questions":[{"q":"câu hỏi","o":["đáp án 1","đáp án 2","đáp án 3","đáp án 4"],"a":0,"e":"giải thích bằng tiếng Việt"}]}, không thêm chữ nào khác, không dùng markdown. Quy tắc: mỗi câu có đúng 4 đáp án (không ghi tiền tố A./B./C./D.); a là chỉ số 0-3 của đáp án đúng duy nhất; phân bố vị trí đáp án đúng đều nhau; nội dung bám sát tài liệu, không bịa thông tin ngoài tài liệu; đáp án nhiễu hợp lý; e giải thích ngắn gọn, dễ hiểu vì sao đáp án đó đúng và nêu căn cứ trong tài liệu.';
 const usr=`Trình độ/đối tượng: ${$('#al').value}\nSố câu: ${n}\nTrọng tâm: ${$('#ag').value}\nYêu cầu bổ sung: ${$('#ax').value.trim()||'(không có)'}\n\nTÀI LIỆU:\n"""\n${src}\n"""`;
 b.disabled=true;r('⏳ AI đang đọc tài liệu và soạn câu hỏi, thường mất 10–40 giây. Vui lòng không đóng trang.');
 try{
  const qs=parseQs(await callAI(c,sys,usr));
  if(!qs.length)throw new Error('AI trả về dữ liệu không đúng định dạng. Hãy bấm tạo lại.');
  D.qs.push(...qs);if(!D.name)D.name='Đề AI – '+new Date().toLocaleDateString('vi-VN');
  TAB='build';vTeacher();say(`✔ AI đã tạo ${qs.length} câu. Hãy rà soát kỹ rồi mới lưu đề.`)
 }catch(e){r('');b.disabled=false;say(e.message,1)}
}

/* --- Dạng bài mới: chạm từ ghép câu, điền từ, ghi âm, video ngắn --- */
const TY={mc:'Trắc nghiệm',order:'Sắp xếp từ thành câu',fill:'Điền từ',rec:'Ghi âm',vid:'Video ngắn'};
const DI={mc:'Read the question and choose the correct answer.',order:'Put the words in the correct order.',fill:'Read the sentence and write the missing word.',rec:'Record yourself answering.',vid:'Record a short video.'};
const nz=s=>String(s??'').toLowerCase().replace(/[.,!?;:"“”]/g,'').replace(/\s+/g,' ').trim();
const isMan=q=>q.t==='rec'||q.t==='vid';
const isOk=(q,a)=>{const t=q.t||'mc';return t==='mc'?a===q.a:t==='order'?nz(a)===nz(q.k):t==='fill'?q.k.split('|').some(x=>nz(x)===nz(a)):false};
const did=(q,a)=>{const t=q.t||'mc';return t==='mc'?a>=0:t==='order'?Array.isArray(a)&&a.length>0:t==='fill'?typeof a==='string'&&a.trim()!=='':a==='rec'};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const MED={},RC={};
function navUp(){
 const e=A.exam,i=A.cur;
 $('#nav').innerHTML=e.qs.map((q,j)=>`<button class="${j===i?'cur':did(q,A.ans[j])?'done':''} ${A.flag[j]?'fl':''}" onclick="go(${j})">${j+1}</button>`).join('');
 $('#pg').textContent=`${e.qs.filter((q,j)=>did(q,A.ans[j])).length}/${e.qs.length} câu`
}
function body(q,i){
 const t=q.t||'mc',a=A.ans[i],v=t==='vid',
  pre=`${q.ins?`<div class="mu"><i>${esc(q.ins)}</i></div>`:''}${q.img?`<img src="${esc(q.img)}" alt="" style="max-width:100%;border-radius:8px;margin:8px 0">`:''}`;
 if(t==='mc')return pre+'<div class="opts">'+q.o.map((o,k)=>`<label class="opt${a===k?' on':''}"><input type="radio" name="o" ${a===k?'checked':''} onchange="pick(${k})"><span><b>${L[k]}.</b> ${esc(o)}</span></label>`).join('')+'</div>';
 if(t==='order'){
  const bk=A.sh[i],u=Array.isArray(a)?a:[];
  return pre+`<div class="ln">${u.map((j,k)=>`<button class="w on" onclick="ord(${k},1)">${esc(bk[j])}</button>`).join('')||'<span class="mu">Chạm vào các từ bên dưới để ghép thành câu</span>'}</div><div class="row">${bk.map((w,j)=>`<button class="w" ${u.includes(j)?'disabled':''} onclick="ord(${j},0)">${esc(w)}</button>`).join('')}</div><div style="margin-top:8px"><button class="b2" onclick="A.ans[${i}]=[];save();renderQ()">Làm lại</button></div>`
 }
 if(t==='fill')return pre+`<input id="fi" value="${esc(typeof a==='string'?a:'')}" placeholder="Nhập đáp án của bạn" autocomplete="off" oninput="A.ans[${i}]=this.value;save();navUp()">`;
 const on=RC.m&&RC.i===i,mx=q.sec||(v?30:60);
 return pre+(on?`<div class="st no"><b id="rt">● Đang ghi...</b> <button class="bd" onclick="RC.m.stop()">■ Dừng</button></div>`:`<div class="row"><button onclick="rec(${i})">${a==='rec'?'● Ghi lại':v?'● Quay video':'● Ghi âm'}</button><span class="mu">Tối đa ${mx} giây · cần cho phép ${v?'camera và micro':'micro'}</span></div>`+(a==='rec'&&MED[i]?`<${v?'video playsinline':'audio'} controls src="${URL.createObjectURL(MED[i])}" style="width:100%;margin-top:8px"></${v?'video':'audio'}>`:''))
}
const ord=(x,rm)=>{const i=A.cur,u=Array.isArray(A.ans[i])?A.ans[i]:A.ans[i]=[];rm?u.splice(x,1):u.push(x);save();renderQ()};
async function rec(i){
 const q=A.exam.qs[i],v=q.t==='vid',mx=q.sec||(v?30:60);
 try{
  const s=await navigator.mediaDevices.getUserMedia(v?{audio:true,video:{width:640,height:480}}:{audio:true});
  const m=new MediaRecorder(s,v?{videoBitsPerSecond:600000}:{}),ch=[];let n=mx;
  m.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
  m.onstop=()=>{s.getTracks().forEach(x=>x.stop());clearInterval(RC.t);RC.m=null;if(!A)return;MED[i]=new Blob(ch,{type:m.mimeType||(v?'video/webm':'audio/webm')});A.ans[i]='rec';save();if(A.cur===i)renderQ();else navUp()};
  RC.m=m;RC.i=i;m.start();renderQ();
  RC.t=setInterval(()=>{n--;const el=$('#rt');if(el)el.textContent=`● Đang ghi... còn ${n} giây`;if(n<=0)m.stop()},1000)
 }catch(e){say('Không mở được micro/camera. Hãy cho phép quyền truy cập và mở trang bằng https.',1)}
}
function qtype(){
 const t=$('#qt').value,x=t==='rec'||t==='vid';
 $('#mcb').style.display=t==='mc'?'':'none';$('#kb').style.display=t==='mc'?'none':'';
 $('#qk').parentNode.style.display=x?'none':'';$('#ks').style.display=x?'':'none';
 $('#kl').textContent=t==='order'?'Câu hoàn chỉnh đúng (học viên sẽ thấy các từ bị xáo trộn)':'Đáp án đúng (nhiều đáp án chấp nhận được thì ngăn cách bằng dấu |)';
 if(!$('#qi').value||Object.values(DI).includes($('#qi').value))$('#qi').value=DI[t]
}
function reviewX(q,i,a){
 const t=q.t,m=isMan(q),pv=a===undefined,ok=!pv&&!m&&isOk(q,a),key=t==='order'?q.k:(q.k||'').split('|').join(' / ');
 const s=pv?'':m?' · <b style="color:var(--wa)">Giáo viên chấm</b>':ok?' · <b style="color:var(--ok)">Đúng</b>':' · <b style="color:var(--no)">Sai</b>';

}
function mediaList(r,e){
 return e?e.qs.map((q,i)=>isMan(q)?`<div class="card"><div class="mu">Câu ${i+1} (${TY[q.t]}): ${esc(q.q)}</div>${String((r.ans||[])[i]).startsWith('M:')?`<button onclick="playMed('${String(r.ans[i]).slice(2)}',this)">▶ Nghe/xem bài nộp</button><div></div>`:'<span class="mu">Học viên chưa nộp bản ghi.</span>'}</div>`:'').join(''):''

/* --- Hỗ trợ giao diện: nhãn độ khó, thanh tiến trình, chọn bài dạng thẻ --- */
const LVN={NB:'Nhận biết',TH:'Thông hiểu',VD:'Vận dụng',VDC:'Vận dụng cao'};
const lvTag=q=>q.lv?`<span class="tag" title="${LVN[q.lv]||''}">${esc(q.lv)}</span>`:'';
const STP=['Thông tin','Làm bài','Nộp bài','Lưu điểm','Xem lại'];
const steps=n=>`<div class="stp" id="stp">${STP.map((s,i)=>`<div class="s${i<n?' dn':i===n?' cu':''}"><span>${i<n?'✓':i+1}</span><small>${s}</small></div>`).join('')}</div>`;
const stepAt=n=>{const e=$('#stp');if(e)e.outerHTML=steps(n)};
const selEx=el=>{document.querySelectorAll('.pick').forEach(x=>x.classList.remove('on'));el.classList.add('on');$('#hs').value=el.dataset.id};

/* --- Cài đặt --- */
function tSet(){
 $('#tb').innerHTML=`<div class="card"><h3>Kết nối Google Sheets</h3><label>Web App URL (Apps Script)<input id="su" value="${esc(url())}" placeholder="https://script.google.com/macros/s/.../exec"></label><div class="row"><button onclick="setUrl($('#su').value.trim())">Lưu URL</button><button class="b2" onclick="setUrl('')">Dùng Demo/Offline</button></div><p class="mu">Chế độ hiện tại: <b>${url()?'Online (Google Sheets)':'Demo/Offline — dữ liệu lưu trên trình duyệt này'}</b>. Khi có URL, mật khẩu giáo viên là biến PASS trong Code.gs. Đổi chế độ xong cần đăng nhập lại. Để học viên ở máy khác cũng kết nối được, hãy điền URL vào biến WEB_APP_URL đầu file.</p></div>
 <div class="card"><h3>Trợ lý AI tạo đề</h3><div class="g2"><label>Nhà cung cấp<select id="ap">${[['gemini','Google Gemini'],['openai','OpenAI'],['proxy','Máy chủ Apps Script (key đặt trong Script Properties)']].map(([v,t])=>`<option value="${v}" ${AI().prov===v?'selected':''}>${t}</option>`).join('')}</select></label><label>Mô hình (để trống = mặc định)<input id="am" value="${esc(AI().model)}" placeholder="gemini-2.5-flash hoặc gpt-4o-mini"></label></div><label>API Key cá nhân<input id="ak" type="password" autocomplete="off" value="${esc(AI().key)}"></label><button onclick="saveAI()">Lưu cấu hình AI</button><p class="mu">Key chỉ lưu trong trình duyệt của giáo viên trên máy này, không nằm trong mã nguồn. Đừng dùng máy chung. Chọn "Máy chủ Apps Script" nếu muốn key không xuất hiện trên trình duyệt (cần kết nối Google Sheets).</p></div>
 <div class="card"><h3>Dữ liệu Demo/Offline</h3><button class="bd" onclick="wipe()">Xóa đề và kết quả offline, nạp lại đề mẫu</button></div>`
}
async function setUrl(u){
 LS('cfg',{url:u});ADMIN=false;PW='';
 try{await loadExams()}catch(e){say('Chưa kết nối được URL này',1)}
 view('teacher')
}
function wipe(){
 if(!confirm('Xóa toàn bộ đề và kết quả offline trên trình duyệt này?'))return;
 ['exams','results','draft','last'].forEach(k=>localStorage.removeItem(k));init()
}

/* ===== KHỞI ĐỘNG ===== */
async function init(){
 try{await loadExams()}catch(e){say('Không tải được danh sách đề: '+e.message,1)}
 const d=LS('draft'),l=LS('last');
 if(d){A=d;A.ans=A.ans.map((x,i)=>x==='rec'&&!MED[i]?-1:x);view('exam')}                       // tải lại trang giữa chừng: làm tiếp bài, đồng hồ không bị reset
 else if(l&&!l.sent){LAST=l;view('result');send()} // điểm chưa gửi được: tự gửi lại
 else view('home')
}
init();
</script>
</body>
</html>
